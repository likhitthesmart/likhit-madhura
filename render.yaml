# Render blueprint for the Express API. The web app stays on Vercel and reaches
# this host through the /api/v1 rewrite in apps/web/next.config.ts.
#
# Deploy: render.com -> New -> Blueprint -> pick this repo. Render reads this file,
# builds apps/api/Dockerfile, and prompts for every `sync: false` value below.
services:
  - type: web
    name: madhura-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Pinned to the Dockerfile's EXPOSE so Render routes to the port the app
      # actually binds (env.ts reads PORT); letting Render pick invites a mismatch.
      - key: PORT
        value: 4000
      # The frontend, not this service: CORS origin, e-mail links, OAuth redirect.
      - key: SITE_URL
        value: https://likhit-madhura.vercel.app
      - key: PAYMENT_PROVIDER
        value: razorpay
      # Generated once by Render and kept across deploys. Never the dev values —
      # a leaked signing secret is every session forgeable.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # sync: false -> Render asks for these in the dashboard and stores them there,
      # so no credential ever lands in git.
      - key: DATABASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
